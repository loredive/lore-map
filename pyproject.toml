[project]
name = "lore-map"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "umap-learn>=0.5.12",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905"]   # zip() over lists built to the same length: strict= would only change behaviour

[tool.ruff.lint.per-file-ignores]
# flush() reads the loop variables but is called within the same iteration, never later
"prepare.py" = ["B023"]
