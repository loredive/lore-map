name: Tests and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3    # no moving major tag since v8
      # the tests don't need the embedding model, only these
      - run: uv run --no-project --with pytest --with numpy --with scikit-learn --with pillow --with cryptography pytest
      - run: node --test tests/*.test.mjs
      - run: uvx ruff@0.17.3 check .
      # the page in a real browser (tests/e2e), so a broken page is never deployed
      - name: Page in a browser
        run: |
          uv run --no-project --with playwright==1.64.0 playwright install --with-deps chromium
          uv run --no-project --with pytest --with playwright==1.64.0 pytest tests/e2e

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3    # no moving major tag since v8

      # Elden Ring icons come from the Fan API; cached so a deploy doesn't download them all again
      - uses: actions/cache@v6
        with:
          path: |
            web/img/elden-ring
            .cache/fanapi
          key: elden-ring-icons-${{ hashFiles('web/data/elden-ring/lore.json', 'images.py') }}
          restore-keys: elden-ring-icons-
      - name: Elden Ring icons
        continue-on-error: true    # if the API is down, the page still works without icons
        run: uv run --no-project --with pillow python images.py --game elden-ring

      # Bloodborne icons come from the game files, so they are uploaded once to the "icons" release
      - name: Bloodborne icons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download icons --pattern img-bloodborne.zip --dir /tmp; then
            mkdir -p web/img/bloodborne && unzip -q -o /tmp/img-bloodborne.zip -d web/img/bloodborne
          else
            echo "No icons release, Bloodborne is deployed without icons"
          fi

      # Dark Souls III icons also come from the game files, uploaded once to the same release
      - name: Dark Souls III icons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download icons --pattern img-dark-souls-3.zip --dir /tmp; then
            mkdir -p web/img/dark-souls-3 && unzip -q -o /tmp/img-dark-souls-3.zip -d web/img/dark-souls-3
          else
            echo "No Dark Souls III icons in the release, it is deployed without icons"
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
